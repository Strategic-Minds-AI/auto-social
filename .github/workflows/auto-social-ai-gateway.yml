name: AUTO SOCIAL AI Gateway
on:
  pull_request:
    paths:
      - 'railway/auto-social-ai-gateway/**'
      - '.github/workflows/auto-social-ai-gateway.yml'
  workflow_dispatch:
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security and proxy contract
        run: node --test railway/auto-social-ai-gateway/tests/gateway.test.mjs
